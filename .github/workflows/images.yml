name: Build Carthage OCI Images
on:
  push:
    branches:
      - master
    paths:
      - carthage/**
      - oci_images/**
      - .github/workflows/images.yml

permissions:
  contents: read
  packages: write

jobs:
  build_image:
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-24.04
            image_suffix: amd64
          - runs_on: ubuntu-24.04-arm
            image_suffix: aarch64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v5

      - name: install dependencies
        run: |
          sudo apt -q update
          sudo apt -y install systemd-container socat qemu-utils fai-setup-storage fai-server python3-mako python3-sh python3-pyvmomi python3-yaml python3-pytest python3-lmdb python3-dateutil ansible genisoimage

      - name: Login to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Build and push arch image set
        env:
          CARTHAGE_IMAGE_SUFFIX: ${{ matrix.image_suffix }}
        run: |
          sudo CARTHAGE_IMAGE_SUFFIX="${CARTHAGE_IMAGE_SUFFIX}" PYTHONPATH=$(pwd) python3 ./bin/carthage-runner ./oci_images deploy --force-confirm

      - name: upload ansible log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images ansible.log ${{ matrix.image_suffix }}
          path: oci_images/ansible.log

  publish_manifest:
    needs: build_image
    runs-on: ubuntu-24.04
    steps:
      - name: Login to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ghcr.io

      - name: Create and push multi-arch manifests
        run: |
          for image in carthage_volume_access carthage carthage-libvirt; do
            target="ghcr.io/hadron/${image}:latest"
            manifest="localhost/${image}-manifest:${GITHUB_RUN_ID}"
            podman manifest create "${manifest}"
            podman manifest add "${manifest}" "docker://${target}-amd64"
            podman manifest add "${manifest}" "docker://${target}-aarch64"
            podman manifest annotate --index "${manifest}" \
              --annotation org.opencontainers.image.source=https://github.com/hadron/carthage \
              --annotation "org.opencontainers.image.description=Carthage is an Infrastructure as Code (IAC) framework."
            podman manifest push --all "${manifest}" "docker://${target}"
            podman manifest rm "${manifest}"
          done
